name: CI Verification Pipeline

on:
  push:
    branches:
      - main
      - release/v2
      - 'docs/**'
      - 'chore/**'
      - 'test/**'
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - release/v2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Formatting Check
        run: npm run lint

      - name: Run Unit, Data & DOM Tests
        run: npm test

      - name: Run Legacy Validation Suite (Transition Gate)
        run: |
          if [ -f scripts/test_app_validation.js ]; then
            npm run test:legacy
          fi
